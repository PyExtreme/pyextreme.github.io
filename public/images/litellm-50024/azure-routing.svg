<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Azure Responses deployment, before and after the routing fix</title>
<desc id="d">Before: turn two of a tool call goes through the Messages-to-Chat adapter, which strips the thinking block, then the chat bridge, which does not ask for encrypted reasoning, so Azure receives zero reasoning items. After: turn two goes through the direct Responses route, so Azure receives the original reasoning item and the include flag. Plain Azure chat deployments stay on chat completions.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">Azure Responses deployments keep their reasoning</text>
<text class="ink2" x="40" y="54" font-size="12.5">Turn two of a tool call, with the signed thinking block replayed</text>
<text class="ink" x="40" y="114" font-size="14" font-weight="600">Before</text>
<text class="ink2" x="40" y="132" font-size="12">via chat detour</text>
<rect class="box" x="160" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="ink" x="220" y="114" font-size="13" font-weight="600" text-anchor="middle">Turn 2</text>
<text class="ink mono" x="220" y="133" font-size="11.5" text-anchor="middle">signed thinking</text>
<line class="line" x1="280" x2="306" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="308" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="368" y="114" font-size="13" font-weight="600" text-anchor="middle">Chat adapter</text>
<text class="badt mono" x="368" y="133" font-size="11.5" text-anchor="middle">strips thinking</text>
<line class="line" x1="428" x2="454" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="456" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="516" y="114" font-size="13" font-weight="600" text-anchor="middle">Chat bridge</text>
<text class="badt mono" x="516" y="133" font-size="11.5" text-anchor="middle">no include</text>
<line class="line" x1="576" x2="602" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="604" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="664" y="114" font-size="13" font-weight="600" text-anchor="middle">Azure</text>
<text class="badt mono" x="664" y="133" font-size="11.5" text-anchor="middle">0 reasoning</text>
<line class="line" x1="40" x2="720" y1="186" y2="186" stroke-width="1"/>
<text class="ink" x="40" y="246" font-size="14" font-weight="600">After</text>
<text class="ink2" x="40" y="264" font-size="12">direct route</text>
<rect class="box" x="160" y="220" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="ink" x="220" y="246" font-size="13" font-weight="600" text-anchor="middle">Turn 2</text>
<text class="ink mono" x="220" y="265" font-size="11.5" text-anchor="middle">signed thinking</text>
<line class="line" x1="280" x2="306" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="308" y="220" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="368" y="246" font-size="13" font-weight="600" text-anchor="middle">Direct route</text>
<text class="goodt mono" x="368" y="265" font-size="11.5" text-anchor="middle">replays it</text>
<line class="line" x1="428" x2="454" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="456" y="220" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="516" y="246" font-size="13" font-weight="600" text-anchor="middle">Azure</text>
<text class="goodt mono" x="516" y="265" font-size="11.5" text-anchor="middle">1 item + include</text>
<text class="ink2" x="600" y="246" font-size="12">chat deployments</text>
<text class="ink2" x="600" y="264" font-size="12">stay on chat</text>
</svg>
