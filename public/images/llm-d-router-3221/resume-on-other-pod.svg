<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A paused session resuming on another pod, before and after</title>
<desc id="d">A thunder-agent session is paused and its next turn is queued. Its own pod, pod-a, is full even after reclaiming idle sessions, while pod-b has room for the turn. Before: the turn can only go back to pod-a, so it waits up to forceAdmitTimeout while pod-b sits unused. After, with resumeOnOtherPod on: the turn is reserved on pod-b and resumes there, recomputing its history. The own pod still wins whenever it fits.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="340" rx="8"/>
<text class="ink" x="30" y="34" font-size="17" font-weight="600">A paused session no longer waits while another pod has room</text>
<text class="ink2" x="30" y="54" font-size="12.5">thunder-agent admission gate, own pod full, a second pod with room for the next turn</text>

<text class="ink" x="30" y="112" font-size="14" font-weight="600">Before</text>
<rect class="box" x="110" y="82" width="150" height="64" rx="6"/>
<text class="ink" x="185" y="106" font-size="13" font-weight="600" text-anchor="middle">Paused session</text>
<text class="ink2 mono" x="185" y="126" font-size="11" text-anchor="middle">next turn queued</text>
<line class="line" x1="260" x2="298" y1="114" y2="114" marker-end="url(#a)"/>
<rect class="bad" x="300" y="82" width="190" height="64" rx="6" stroke-width="1.5"/>
<text class="badt" x="395" y="106" font-size="13" font-weight="600" text-anchor="middle">pod-a (own pod)</text>
<text class="badt mono" x="395" y="126" font-size="11" text-anchor="middle">full: turn waits</text>
<rect class="box" x="520" y="82" width="200" height="64" rx="6"/>
<text class="ink" x="620" y="106" font-size="13" font-weight="600" text-anchor="middle">pod-b</text>
<text class="ink2 mono" x="620" y="126" font-size="11" text-anchor="middle">has room, unused</text>
<text class="ink2" x="300" y="168" font-size="12">waits for its own pod, up to forceAdmitTimeout</text>

<line class="line" x1="30" x2="740" y1="186" y2="186" stroke-width="1"/>

<text class="ink" x="30" y="256" font-size="14" font-weight="600">After</text>
<text class="ink2 mono" x="30" y="274" font-size="10.5">resumeOnOtherPod</text>
<rect class="box" x="110" y="226" width="150" height="64" rx="6"/>
<text class="ink" x="185" y="250" font-size="13" font-weight="600" text-anchor="middle">Paused session</text>
<text class="ink2 mono" x="185" y="270" font-size="11" text-anchor="middle">next turn queued</text>
<rect class="box" x="300" y="226" width="190" height="64" rx="6"/>
<text class="ink" x="395" y="250" font-size="13" font-weight="600" text-anchor="middle">pod-a (own pod)</text>
<text class="ink2 mono" x="395" y="270" font-size="11" text-anchor="middle">still full</text>
<path class="line" d="M260 240 H280 V206 H620 V222" marker-end="url(#a)"/>
<rect class="good" x="520" y="226" width="200" height="64" rx="6" stroke-width="1.5"/>
<text class="goodt" x="620" y="250" font-size="13" font-weight="600" text-anchor="middle">pod-b</text>
<text class="goodt mono" x="620" y="270" font-size="11" text-anchor="middle">resumes, recomputes</text>
<text class="ink2" x="300" y="312" font-size="12">own pod still wins whenever it fits</text>
</svg>
