<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A recreated pod and the old pod's blacklist entry, before and after</title>
<desc id="d">Before: the blacklist entry is keyed by namespace and name only. The old pod web-0 with UID A is quarantined after three dead probe sweeps, the pod is recreated as web-0 with UID B, and the new pod reads the same entry and is refused. After: the entry also records UID A. The new pod's UID B does not match, so readers treat the entry as absent and the new pod is admitted, while the old pod stays quarantined.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">A recreated pod no longer inherits the old pod's block</text>
<text class="ink2" x="40" y="54" font-size="12.5">StatefulSet replica default/web-0 deleted and recreated under the same name</text>

<text class="ink" x="40" y="114" font-size="14" font-weight="600">Before</text>
<text class="ink2 mono" x="40" y="132" font-size="11.5">key: ns/name</text>
<rect class="box" x="160" y="88" width="170" height="62" rx="6"/>
<text class="ink" x="245" y="114" font-size="13" font-weight="600" text-anchor="middle">Old pod web-0</text>
<text class="ink2 mono" x="245" y="133" font-size="11.5" text-anchor="middle">uid A · 3 dead sweeps</text>
<line class="line" x1="330" x2="356" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="358" y="88" width="170" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="443" y="114" font-size="13" font-weight="600" text-anchor="middle">Entry default/web-0</text>
<text class="badt mono" x="443" y="133" font-size="11.5" text-anchor="middle">quarantined 1h</text>
<line class="line" x1="528" x2="554" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="556" y="88" width="170" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="641" y="114" font-size="13" font-weight="600" text-anchor="middle">New pod web-0</text>
<text class="badt mono" x="641" y="133" font-size="11.5" text-anchor="middle">uid B · Allow=false</text>

<line class="line" x1="40" x2="720" y1="186" y2="186" stroke-width="1"/>

<text class="ink" x="40" y="246" font-size="14" font-weight="600">After</text>
<text class="ink2 mono" x="40" y="264" font-size="11.5">key + pod UID</text>
<rect class="box" x="160" y="220" width="170" height="62" rx="6"/>
<text class="ink" x="245" y="246" font-size="13" font-weight="600" text-anchor="middle">Old pod web-0</text>
<text class="ink2 mono" x="245" y="265" font-size="11.5" text-anchor="middle">uid A · quarantined</text>
<line class="line" x1="330" x2="356" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="358" y="220" width="170" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="443" y="246" font-size="13" font-weight="600" text-anchor="middle">Entry default/web-0</text>
<text class="goodt mono" x="443" y="265" font-size="11.5" text-anchor="middle">uid A ≠ uid B</text>
<line class="line" x1="528" x2="554" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="556" y="220" width="170" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="641" y="246" font-size="13" font-weight="600" text-anchor="middle">New pod web-0</text>
<text class="goodt mono" x="641" y="265" font-size="11.5" text-anchor="middle">uid B · Allow=true</text>

<text class="ink2" x="40" y="312" font-size="12">The first write for uid B resets the entry in place, which also takes the old exclusion off the excluded count.</text>
</svg>
