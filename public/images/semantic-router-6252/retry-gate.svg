<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A 403 with a truncated error body, before and after</title>
<desc id="d">Before: the backend answers 403 with a body cut short, readResponse fails to read it, marks the error retryable without checking the status, and sends the request again; the error shows only unexpected EOF. After: the retry check also requires retryableStatus, so the 403 stops after one attempt and the error reads read error body of HTTP status 403: unexpected EOF.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">A 403 with a cut-off error body is no longer retried</text>
<text class="ink2" x="40" y="54" font-size="12.5">Backend declares Content-Length 32, sends 7 bytes, closes</text>

<text class="ink" x="40" y="114" font-size="14" font-weight="600">Before</text>
<rect class="box" x="130" y="88" width="140" height="62" rx="6"/>
<text class="ink" x="200" y="114" font-size="13" font-weight="600" text-anchor="middle">HTTP 403</text>
<text class="ink2 mono" x="200" y="133" font-size="11" text-anchor="middle">body read: EOF</text>
<line class="line" x1="270" x2="296" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="298" y="88" width="190" height="62" rx="6" stroke-width="1.5"/>
<text class="badt mono" x="393" y="114" font-size="11" text-anchor="middle">RetrySafe &amp;&amp; ctx ok</text>
<text class="badt" x="393" y="133" font-size="12" text-anchor="middle">retryable = true</text>
<line class="line" x1="488" x2="514" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="516" y="88" width="204" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="618" y="114" font-size="13" font-weight="600" text-anchor="middle">sent again</text>
<text class="badt mono" x="618" y="133" font-size="11" text-anchor="middle">err: unexpected EOF</text>

<line class="line" x1="40" x2="720" y1="186" y2="186" stroke-width="1"/>

<text class="ink" x="40" y="246" font-size="14" font-weight="600">After</text>
<rect class="box" x="130" y="220" width="140" height="62" rx="6"/>
<text class="ink" x="200" y="246" font-size="13" font-weight="600" text-anchor="middle">HTTP 403</text>
<text class="ink2 mono" x="200" y="265" font-size="11" text-anchor="middle">body read: EOF</text>
<line class="line" x1="270" x2="296" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="298" y="220" width="190" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt mono" x="393" y="246" font-size="11" text-anchor="middle">&amp;&amp; retryableStatus(403)</text>
<text class="goodt" x="393" y="265" font-size="12" text-anchor="middle">retryable = false</text>
<line class="line" x1="488" x2="514" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="516" y="220" width="204" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="618" y="246" font-size="13" font-weight="600" text-anchor="middle">one attempt</text>
<text class="goodt mono" x="618" y="265" font-size="11" text-anchor="middle">err: HTTP status 403: EOF</text>
<text class="ink2" x="40" y="312" font-size="12">A 503 with a cut-off body is still retried, since retryableStatus(503) is true.</text>
</svg>
