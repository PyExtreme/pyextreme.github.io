<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">How plugins find the prefill endpoint, before and after</title>
<desc id="d">Before: the profile handler runs profiles named decode and prefill-h200. Plugins look up the profile named prefill, find nothing, and use the decode pod. After: the handler also sets PrefillProfileName to prefill-h200 on the scheduling result, and plugins call PrefillProfile() to reach the prefill pod.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">Plugins now read the prefill profile name from the result</text>
<text class="ink2" x="40" y="54" font-size="12.5">Prefill profile renamed to prefill-h200, decode is primary</text>

<text class="ink" x="40" y="104" font-size="14" font-weight="600">Before</text>
<rect class="box" x="40" y="116" width="220" height="56" rx="6"/>
<text class="ink2 mono" x="52" y="138" font-size="11">ProfileResults:</text>
<text class="ink2 mono" x="52" y="156" font-size="11">decode, prefill-h200</text>
<line class="line" x1="260" x2="296" y1="144" y2="144" marker-end="url(#a)"/>
<rect class="bad" x="298" y="116" width="200" height="56" rx="6" stroke-width="1.5"/>
<text class="badt" x="398" y="138" font-size="12.5" font-weight="600" text-anchor="middle">6 plugins</text>
<text class="badt mono" x="398" y="156" font-size="11" text-anchor="middle">lookup "prefill": nil</text>
<line class="line" x1="498" x2="534" y1="144" y2="144" marker-end="url(#a)"/>
<rect class="bad" x="536" y="116" width="184" height="56" rx="6" stroke-width="1.5"/>
<text class="badt" x="628" y="138" font-size="12.5" font-weight="600" text-anchor="middle">decode pod</text>
<text class="badt" x="628" y="156" font-size="11.5" text-anchor="middle">credited with prefill</text>

<line class="line" x1="40" x2="720" y1="196" y2="196" stroke-width="1"/>

<text class="ink" x="40" y="236" font-size="14" font-weight="600">After</text>
<rect class="good" x="40" y="248" width="220" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt mono" x="52" y="270" font-size="11">PrefillProfileName:</text>
<text class="goodt mono" x="52" y="288" font-size="11">"prefill-h200"</text>
<line class="line" x1="260" x2="296" y1="276" y2="276" marker-end="url(#a)"/>
<rect class="good" x="298" y="248" width="200" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt" x="398" y="270" font-size="12.5" font-weight="600" text-anchor="middle">6 plugins</text>
<text class="goodt mono" x="398" y="288" font-size="11" text-anchor="middle">PrefillProfile()</text>
<line class="line" x1="498" x2="534" y1="276" y2="276" marker-end="url(#a)"/>
<rect class="good" x="536" y="248" width="184" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt" x="628" y="270" font-size="12.5" font-weight="600" text-anchor="middle">prefill pod</text>
<text class="goodt" x="628" y="288" font-size="11.5" text-anchor="middle">indexed, released</text>
</svg>
