<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">The conditional-decode probe's revision header, dropped before the fix and forwarded after it</title>
<desc id="d">The coordinator sends a conditional-decode probe with Prefer: if-available. The decode EPP has a prefix cache miss and answers 412 with x-llm-d-disagg-revision: B. Before the fix, the coordinator's 412 branch returns errCacheMiss without reading the headers, so the prefill request carries no revision and its EPP may pick any revision, which decode then follows. After the fix, CaptureResponseHeaders stores the header and the prefill and decode requests both carry revision B.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="340" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">The probe's revision was lost on a 412</text>
<text class="ink2" x="40" y="54" font-size="12.5">Coordinator pipeline: conditional-decode probe, then prefill and decode on a cache miss</text>

<rect class="box" x="40" y="72" width="210" height="62" rx="6"/>
<text class="ink mono" x="145" y="98" font-size="12" font-weight="600" text-anchor="middle">conditional-decode</text>
<text class="ink2 mono" x="145" y="117" font-size="11" text-anchor="middle">Prefer: if-available</text>
<line class="line" x1="250" x2="284" y1="103" y2="103" marker-end="url(#a)"/>
<rect class="box" x="286" y="72" width="200" height="62" rx="6"/>
<text class="ink" x="386" y="98" font-size="13" font-weight="600" text-anchor="middle">decode EPP</text>
<text class="ink2" x="386" y="117" font-size="11.5" text-anchor="middle">prefix cache miss</text>
<line class="line" x1="486" x2="520" y1="103" y2="103" marker-end="url(#a)"/>
<rect class="box" x="522" y="72" width="208" height="62" rx="6"/>
<text class="ink" x="626" y="98" font-size="13" font-weight="600" text-anchor="middle">412 Precondition Failed</text>
<text class="ink mono" x="626" y="117" font-size="11" text-anchor="middle">x-llm-d-disagg-revision: B</text>

<text class="badt" x="40" y="200" font-size="11.5" font-weight="600">BEFORE</text>
<rect class="bad" x="100" y="168" width="190" height="56" rx="6" stroke-width="1.5"/>
<text class="badt" x="195" y="191" font-size="12.5" font-weight="600" text-anchor="middle">412 branch</text>
<text class="badt mono" x="195" y="209" font-size="11" text-anchor="middle">return errCacheMiss</text>
<line class="line" x1="290" x2="324" y1="196" y2="196" marker-end="url(#a)"/>
<rect class="bad" x="326" y="168" width="190" height="56" rx="6" stroke-width="1.5"/>
<text class="badt" x="421" y="191" font-size="12.5" font-weight="600" text-anchor="middle">prefill request</text>
<text class="badt" x="421" y="209" font-size="11.5" text-anchor="middle">no header, EPP picks any</text>
<line class="line" x1="516" x2="550" y1="196" y2="196" marker-end="url(#a)"/>
<rect class="bad" x="552" y="168" width="178" height="56" rx="6" stroke-width="1.5"/>
<text class="badt" x="641" y="191" font-size="12.5" font-weight="600" text-anchor="middle">decode request</text>
<text class="badt" x="641" y="209" font-size="11.5" text-anchor="middle">follows prefill: A or B</text>

<text class="goodt" x="40" y="280" font-size="11.5" font-weight="600">AFTER</text>
<rect class="good" x="100" y="248" width="190" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt" x="195" y="271" font-size="12.5" font-weight="600" text-anchor="middle">412 branch</text>
<text class="goodt mono" x="195" y="289" font-size="11" text-anchor="middle">CaptureResponseHeaders</text>
<line class="line" x1="290" x2="324" y1="276" y2="276" marker-end="url(#a)"/>
<rect class="good" x="326" y="248" width="190" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt" x="421" y="271" font-size="12.5" font-weight="600" text-anchor="middle">prefill request</text>
<text class="goodt mono" x="421" y="289" font-size="11" text-anchor="middle">strict revision B</text>
<line class="line" x1="516" x2="550" y1="276" y2="276" marker-end="url(#a)"/>
<rect class="good" x="552" y="248" width="178" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt" x="641" y="271" font-size="12.5" font-weight="600" text-anchor="middle">decode request</text>
<text class="goodt mono" x="641" y="289" font-size="11" text-anchor="middle">strict revision B</text>
<text class="ink2" x="40" y="326" font-size="11.5">Encode, when present, receives the same header. The EPP side must also stamp the 412 (part 2).</text>
</svg>
