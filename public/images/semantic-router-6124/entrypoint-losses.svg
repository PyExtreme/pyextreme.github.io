<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Accepted translation losses per entrypoint, before and after</title>
<desc id="d">One Router with a global allow_lossy_translation of tools.defer_loading receives a Messages request for vllm-sr/codex that carries a deferred tool. Before: the ingress decode runs with the global list because the entrypoint is only resolved after decode, so the Codex request is accepted and the deferred tool is dropped. After: the Router reads the model from the body first, resolves the vllm-sr/codex entrypoint and its empty list, and the decode refuses the request with a 400 unsupported_tools_defer_loading error. The vllm-sr/claude-code entrypoint on the same Router keeps accepting tools.defer_loading.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="340" rx="8"/>
<text class="ink" x="30" y="34" font-size="17" font-weight="600">Each entrypoint now decides which losses it accepts</text>
<text class="ink2" x="30" y="54" font-size="12.5">One Router, global list [tools.defer_loading], a Codex request carrying a deferred tool</text>

<text class="ink" x="30" y="112" font-size="14" font-weight="600">Before</text>
<rect class="box" x="110" y="82" width="170" height="64" rx="6"/>
<text class="ink2 mono" x="195" y="109" font-size="11" text-anchor="middle">model: vllm-sr/codex</text>
<text class="ink2 mono" x="195" y="127" font-size="11" text-anchor="middle">tools[].defer_loading</text>
<line class="line" x1="280" x2="304" y1="114" y2="114" marker-end="url(#a)"/>
<rect class="box" x="306" y="82" width="190" height="64" rx="6"/>
<text class="ink" x="401" y="106" font-size="13" font-weight="600" text-anchor="middle">Ingress decode</text>
<text class="ink2 mono" x="401" y="126" font-size="11" text-anchor="middle">losses: global list</text>
<line class="line" x1="496" x2="520" y1="114" y2="114" marker-end="url(#a)"/>
<rect class="bad" x="522" y="82" width="218" height="64" rx="6" stroke-width="1.5"/>
<text class="badt" x="631" y="106" font-size="13" font-weight="600" text-anchor="middle">Accepted on Codex</text>
<text class="badt mono" x="631" y="126" font-size="11" text-anchor="middle">deferred tool dropped</text>
<text class="ink2" x="306" y="168" font-size="12">entrypoint is resolved only after decode</text>

<line class="line" x1="30" x2="740" y1="190" y2="190" stroke-width="1"/>

<text class="ink" x="30" y="244" font-size="14" font-weight="600">After</text>
<rect class="box" x="110" y="214" width="170" height="64" rx="6"/>
<text class="ink2 mono" x="195" y="241" font-size="11" text-anchor="middle">model: vllm-sr/codex</text>
<text class="ink2 mono" x="195" y="259" font-size="11" text-anchor="middle">tools[].defer_loading</text>
<line class="line" x1="280" x2="304" y1="246" y2="246" marker-end="url(#a)"/>
<rect class="good" x="306" y="214" width="190" height="64" rx="6" stroke-width="1.5"/>
<text class="goodt" x="401" y="238" font-size="13" font-weight="600" text-anchor="middle">Entrypoint, then decode</text>
<text class="goodt mono" x="401" y="258" font-size="11" text-anchor="middle">vllm-sr/codex: []</text>
<line class="line" x1="496" x2="520" y1="246" y2="246" marker-end="url(#a)"/>
<rect class="good" x="522" y="214" width="218" height="64" rx="6" stroke-width="1.5"/>
<text class="goodt" x="631" y="238" font-size="13" font-weight="600" text-anchor="middle">Refused with 400</text>
<text class="goodt mono" x="631" y="258" font-size="10.5" text-anchor="middle">unsupported_tools_defer_loading</text>
<text class="ink2" x="306" y="300" font-size="12">model read from the body before decode picks the list</text>
<text class="ink2" x="306" y="318" font-size="12">vllm-sr/claude-code still accepts tools.defer_loading</text>
</svg>
