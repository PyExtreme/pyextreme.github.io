<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">One end user across a failed budget reset and its retry, before and after</title>
<desc id="d">A rollover tier has a cap of 10 and an end user with spend 15. Before: the first tick resets the end user to 5 in its own committed page, then the window advance fails. The retry replays the end-user reset, sees 5 as a spend under the cap and zeroes it, so the carried 5 is lost. After: the first tick stamps the user with the window it closed. The retry sees the stamp, skips the user, and spend stays at 5.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">A retried reset no longer wipes the carried spend</text>
<text class="ink2" x="40" y="54" font-size="12.5">One end user on a rollover tier with cap 10, spend 15, and one failed window advance</text>

<text class="ink" x="40" y="114" font-size="14" font-weight="600">Before</text>
<text class="ink2" x="40" y="132" font-size="12">no record</text>
<rect class="box" x="160" y="88" width="140" height="62" rx="6"/>
<text class="ink" x="230" y="114" font-size="13" font-weight="600" text-anchor="middle">Start</text>
<text class="ink2 mono" x="230" y="133" font-size="11.5" text-anchor="middle">spend 15</text>
<line class="line" x1="300" x2="326" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="box" x="328" y="88" width="140" height="62" rx="6"/>
<text class="ink" x="398" y="114" font-size="13" font-weight="600" text-anchor="middle">Tick 1 fails</text>
<text class="ink2 mono" x="398" y="133" font-size="11.5" text-anchor="middle">spend 5 · retry</text>
<line class="line" x1="468" x2="494" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="496" y="88" width="140" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="566" y="114" font-size="13" font-weight="600" text-anchor="middle">Retry</text>
<text class="badt mono" x="566" y="133" font-size="11.5" text-anchor="middle">spend 0 · lost</text>
<text class="ink2" x="40" y="168" font-size="12">5 is under the cap, so the replay zeroes it</text>

<line class="line" x1="40" x2="720" y1="196" y2="196" stroke-width="1"/>

<text class="ink" x="40" y="246" font-size="14" font-weight="600">After</text>
<text class="ink2 mono" x="40" y="264" font-size="11.5">stamp: window</text>
<rect class="box" x="160" y="220" width="140" height="62" rx="6"/>
<text class="ink" x="230" y="246" font-size="13" font-weight="600" text-anchor="middle">Start</text>
<text class="ink2 mono" x="230" y="265" font-size="11.5" text-anchor="middle">spend 15</text>
<line class="line" x1="300" x2="326" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="box" x="328" y="220" width="140" height="62" rx="6"/>
<text class="ink" x="398" y="246" font-size="13" font-weight="600" text-anchor="middle">Tick 1 fails</text>
<text class="ink2 mono" x="398" y="265" font-size="11.5" text-anchor="middle">5 · stamped</text>
<line class="line" x1="468" x2="494" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="496" y="220" width="140" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="566" y="246" font-size="13" font-weight="600" text-anchor="middle">Retry</text>
<text class="goodt mono" x="566" y="265" font-size="11.5" text-anchor="middle">spend 5 · skipped</text>
<text class="ink2" x="40" y="304" font-size="12">The stamp matches the window being closed, so the retry leaves the user alone</text>
</svg>
