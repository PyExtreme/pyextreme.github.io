<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">MarketLane Research as built</title>
<desc id="d">A browser running a private Next.js workspace calls a global HTTPS load balancer, which routes to a FastAPI service on Cloud Run exposing retrieve, research and compare-filings endpoints. The service reads one PostgreSQL 18 database with pgvector holding filings, sections, tables, chunks with vectors, XBRL facts and job state, and calls Vertex AI for embeddings and generation. An ingestion job discovers filings on SEC EDGAR, stores content-addressed raw artifacts with create-only writes, parses and chunks them heading-aware, embeds them and publishes atomically under a per-document advisory lock. SEC CompanyFacts XBRL is the authority for reported numbers.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.good{fill:#e6effa;stroke:#2a78d6}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.good{fill:#1b2a3d;stroke:#3987e5}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="412" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">As built: one database, two serving endpoints, one idempotent ingestion job</text>
<text class="ink2" x="40" y="54" font-size="12.5">GCP, as archived on 24 October 2026 · 110 companies · 3,783 filings · 283,982 chunks with 768-d vectors · 167,493 XBRL facts</text>

<rect class="box" x="40" y="80" width="150" height="56" rx="6"/>
<text class="ink" x="115" y="104" font-size="13" font-weight="600" text-anchor="middle">Browser</text>
<text class="ink2 mono" x="115" y="123" font-size="11.5" text-anchor="middle">Next.js · sign-in</text>
<line class="line" x1="190" x2="214" y1="108" y2="108" marker-end="url(#a)"/>
<rect class="box" x="216" y="80" width="110" height="56" rx="6"/>
<text class="ink" x="271" y="104" font-size="13" font-weight="600" text-anchor="middle">HTTPS LB</text>
<text class="ink2 mono" x="271" y="123" font-size="11.5" text-anchor="middle">managed cert</text>
<line class="line" x1="326" x2="350" y1="108" y2="108" marker-end="url(#a)"/>
<rect class="good" x="352" y="80" width="368" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt" x="536" y="104" font-size="13" font-weight="600" text-anchor="middle">FastAPI on Cloud Run · scale to zero · citations validated</text>
<text class="goodt mono" x="536" y="123" font-size="11.5" text-anchor="middle">/v1/retrieve   /v1/research   /v1/compare-filings</text>

<line class="line" x1="440" x2="440" y1="136" y2="166" marker-end="url(#a)"/>
<line class="line" x1="640" x2="640" y1="136" y2="166" marker-end="url(#a)"/>

<rect class="box" x="40" y="170" width="500" height="56" rx="6"/>
<text class="ink" x="290" y="194" font-size="13" font-weight="600" text-anchor="middle">PostgreSQL 18 + pgvector · HNSW cosine · GIN full-text</text>
<text class="ink2 mono" x="290" y="213" font-size="11.5" text-anchor="middle">filings · sections · tables · chunks + vectors · XBRL facts · job state</text>
<rect class="box" x="560" y="170" width="160" height="56" rx="6"/>
<text class="ink" x="640" y="194" font-size="13" font-weight="600" text-anchor="middle">Vertex AI</text>
<text class="ink2 mono" x="640" y="213" font-size="11.5" text-anchor="middle">Gemini · embeddings</text>

<text class="ink2" x="40" y="258" font-size="11.5">Ingestion job · Cloud Run Job · one task, at most two workers, one shared SEC rate limiter</text>
<path class="line" d="M654 270 L654 248 L520 248 L520 230" marker-end="url(#a)"/>

<rect class="box" x="40" y="270" width="96" height="56" rx="6"/>
<text class="ink" x="88" y="294" font-size="13" font-weight="600" text-anchor="middle">SEC EDGAR</text>
<text class="ink2 mono" x="88" y="313" font-size="11.5" text-anchor="middle">10-K · 10-Q</text>
<line class="line" x1="136" x2="156" y1="298" y2="298" marker-end="url(#a)"/>
<rect class="box" x="158" y="270" width="158" height="56" rx="6"/>
<text class="ink" x="237" y="294" font-size="13" font-weight="600" text-anchor="middle">Raw artifacts</text>
<text class="ink2 mono" x="237" y="313" font-size="11.5" text-anchor="middle">SHA-256 · create-only</text>
<line class="line" x1="316" x2="338" y1="298" y2="298" marker-end="url(#a)"/>
<rect class="box" x="340" y="270" width="116" height="56" rx="6"/>
<text class="ink" x="398" y="294" font-size="13" font-weight="600" text-anchor="middle">Parse + chunk</text>
<text class="ink2 mono" x="398" y="313" font-size="11.5" text-anchor="middle">heading-aware</text>
<line class="line" x1="456" x2="478" y1="298" y2="298" marker-end="url(#a)"/>
<rect class="box" x="480" y="270" width="84" height="56" rx="6"/>
<text class="ink" x="522" y="294" font-size="13" font-weight="600" text-anchor="middle">Embed</text>
<text class="ink2 mono" x="522" y="313" font-size="11.5" text-anchor="middle">768-d</text>
<line class="line" x1="564" x2="586" y1="298" y2="298" marker-end="url(#a)"/>
<rect class="good" x="588" y="270" width="132" height="56" rx="6" stroke-width="1.5"/>
<text class="goodt" x="654" y="294" font-size="13" font-weight="600" text-anchor="middle">Atomic publish</text>
<text class="goodt mono" x="654" y="313" font-size="11.5" text-anchor="middle">advisory lock</text>

<text class="ink2" x="40" y="354" font-size="12">Reruns skip unchanged work by content hash and by parser, chunker and embedding version.</text>
<text class="ink2" x="40" y="372" font-size="12">A failed refresh leaves the last complete version searchable; a per-document advisory lock stops duplicate publication.</text>
<text class="ink2" x="40" y="390" font-size="12">SEC CompanyFacts (XBRL) is the authority for reported numbers; a deterministic calculator does the arithmetic.</text>
</svg>
