<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Task success as the conversation grows, 900-token budget</title>
<desc id="d">Experiment 2. Turns 10, 40, 120, 320 (about 11,600 tokens at 320). Adaptive and retrieval 100% at every length. Summarization 100, 90, 80, 70. Sliding window 100, 50, 20, 10. Full history at the same budget overflows from 40 turns: 100, 0, 0, 0.</desc>
