<text class="ink2" x="78" y="50" font-size="12.5">Task success vs mean context tokens · 900-token budget · full history sent unbounded as the reference</text>
<line class="grid" x1="78" x2="720" y1="350.0" y2="350.0" stroke-width="1"/>
