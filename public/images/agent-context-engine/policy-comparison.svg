<text class="ink2" x="68" y="215.0" font-size="12" text-anchor="end">50%</text>
<line class="grid" x1="78" x2="720" y1="141.5" y2="141.5" stroke-width="1"/>
<text class="ink2" x="68" y="145.5" font-size="12" text-anchor="end">75%</text>
<line class="grid" x1="78" x2="720" y1="72.0" y2="72.0" stroke-width="1"/>
<text class="ink2" x="68" y="76.0" font-size="12" text-anchor="end">100%</text>
