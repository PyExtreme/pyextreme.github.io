<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A /v1/responses request through Dynamo's EPP, before and after</title>
<desc id="d">Before: the EPP reads the body, finds neither messages nor prompt, defaults to parsing it as a chat request, and the pick fails with HTTP 400 because messages is missing. After: the EPP reads the :path pseudo-header, converts the Responses body with the Frontend's own conversion, tokenizes it with the chat template, and the KV router picks the worker with the best cached prefix.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="300" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">The URL now picks the API, so Responses requests reach a worker</text>
<text class="ink2" x="40" y="54" font-size="12.5">Path of one /v1/responses request through the EPP</text>

<text class="ink" x="40" y="112" font-size="14" font-weight="600">Before</text>
<text class="ink2" x="40" y="130" font-size="12">guess from body</text>
<rect class="box" x="140" y="86" width="128" height="62" rx="6"/>
<text class="ink" x="204" y="112" font-size="13" font-weight="600" text-anchor="middle">Read body</text>
<text class="ink2" x="204" y="131" font-size="12" text-anchor="middle">check its fields</text>
<line class="line" x1="268" x2="288" y1="117" y2="117" marker-end="url(#a)"/>
<rect class="box" x="290" y="86" width="128" height="62" rx="6"/>
<text class="ink" x="354" y="112" font-size="13" font-weight="600" text-anchor="middle">No match</text>
<text class="ink2" x="354" y="131" font-size="12" text-anchor="middle">only has <tspan class="mono">input</tspan></text>
<line class="line" x1="418" x2="438" y1="117" y2="117" marker-end="url(#a)"/>
<rect class="box" x="440" y="86" width="128" height="62" rx="6"/>
<text class="ink" x="504" y="112" font-size="13" font-weight="600" text-anchor="middle">Parse as chat</text>
<text class="ink2" x="504" y="131" font-size="12" text-anchor="middle">the default</text>
<line class="line" x1="568" x2="588" y1="117" y2="117" marker-end="url(#a)"/>
<rect class="bad" x="590" y="86" width="128" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="654" y="112" font-size="13" font-weight="600" text-anchor="middle">HTTP 400</text>
<text class="badt" x="654" y="131" font-size="12" text-anchor="middle">no <tspan class="mono">messages</tspan></text>

<line class="line" x1="40" x2="720" y1="178" y2="178" stroke-width="1"/>

<text class="ink" x="40" y="234" font-size="14" font-weight="600">After</text>
<text class="ink2" x="40" y="252" font-size="12">path + reuse</text>
<rect class="box" x="140" y="208" width="128" height="62" rx="6"/>
<text class="ink" x="204" y="234" font-size="13" font-weight="600" text-anchor="middle">Read <tspan class="mono">:path</tspan></text>
<text class="ink2 mono" x="204" y="253" font-size="11.5" text-anchor="middle">/v1/responses</text>
<line class="line" x1="268" x2="288" y1="239" y2="239" marker-end="url(#a)"/>
<rect class="box" x="290" y="208" width="128" height="62" rx="6"/>
<text class="ink" x="354" y="234" font-size="13" font-weight="600" text-anchor="middle">Convert</text>
<text class="ink2" x="354" y="253" font-size="12" text-anchor="middle">Frontend's code</text>
<line class="line" x1="418" x2="438" y1="239" y2="239" marker-end="url(#a)"/>
<rect class="box" x="440" y="208" width="128" height="62" rx="6"/>
<text class="ink" x="504" y="234" font-size="13" font-weight="600" text-anchor="middle">Tokenize</text>
<text class="ink2" x="504" y="253" font-size="12" text-anchor="middle">chat template</text>
<line class="line" x1="568" x2="588" y1="239" y2="239" marker-end="url(#a)"/>
<rect class="good" x="590" y="208" width="128" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="654" y="234" font-size="13" font-weight="600" text-anchor="middle">KV router</text>
<text class="goodt" x="654" y="253" font-size="12" text-anchor="middle">best cached worker</text>
</svg>
