<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .bg { fill: #f7f8f5; }
    .axis { stroke: #b4bdb8; stroke-width: 1; }
    .grid { stroke: #d9dfdc; stroke-width: 0.5; stroke-dasharray: 4 3; }
    .label { fill: #5c6561; font-size: 11px; }
    .value { fill: #17211f; font-size: 12px; font-weight: 600; }
    .title { fill: #17211f; font-size: 14px; font-weight: 700; }
    .subtitle { fill: #5c6561; font-size: 11px; }
    .dot { stroke-width: 2; }
    .dot-b1 { fill: #8fae1c; stroke: #6d8a10; }
    .dot-ma { fill: #17211f; stroke: #17211f; }
    .dot-ce { fill: #2d8a7e; stroke: #1f6b62; }
    .dot-vote { fill: #d6ef62; stroke: #8fae1c; }
    .connector { stroke: #d9dfdc; stroke-width: 1; stroke-dasharray: 3 2; }
    .anno { fill: #3f4946; font-size: 10px; }
    .best { fill: #8fae1c; font-size: 10px; font-weight: 700; }
  </style>
  <rect class="bg" width="680" height="260" rx="6"/>

  <text class="title" x="40" y="28">Accuracy vs Cost per Incident</text>
  <text class="subtitle" x="40" y="43">Both phases combined · lower-right is better</text>

  <!-- Legend -->
  <circle class="dot dot-b1" cx="400" cy="22" r="5"/>
  <text class="anno" x="410" y="26">B1 (single agent)</text>
  <circle class="dot dot-ma" cx="520" cy="22" r="5"/>
  <text class="anno" x="530" y="26">MA (multi-agent)</text>
  <circle class="dot dot-ce" cx="400" cy="40" r="5"/>
  <text class="anno" x="410" y="44">CE (causal engine)</text>
  <circle class="dot dot-vote" cx="520" cy="40" r="5"/>
  <text class="anno" x="530" y="44">Vote of 3</text>

  <!-- Axes -->
  <line class="axis" x1="80" y1="60" x2="80" y2="220"/>
  <line class="axis" x1="80" y1="220" x2="640" y2="220"/>

  <!-- Y axis: accuracy 0.60 to 1.00 -->
  <text class="label" x="72" y="64" text-anchor="end">1.00</text>
  <line class="grid" x1="80" y1="60" x2="640" y2="60"/>
  <text class="label" x="72" y="104" text-anchor="end">0.90</text>
  <line class="grid" x1="80" y1="100" x2="640" y2="100"/>
  <text class="label" x="72" y="144" text-anchor="end">0.80</text>
  <line class="grid" x1="80" y1="140" x2="640" y2="140"/>
  <text class="label" x="72" y="184" text-anchor="end">0.70</text>
  <line class="grid" x1="80" y1="180" x2="640" y2="180"/>

  <!-- X axis: cost $0 to $0.12 -->
  <text class="label" x="80" y="236" text-anchor="middle">$0</text>
  <text class="label" x="220" y="236" text-anchor="middle">$0.03</text>
  <text class="label" x="360" y="236" text-anchor="middle">$0.06</text>
  <text class="label" x="500" y="236" text-anchor="middle">$0.09</text>
  <text class="label" x="640" y="236" text-anchor="middle">$0.12</text>
  <text class="label" x="360" y="252" text-anchor="middle">Cost per incident ($)</text>

  <!-- Data points: RE2 fast model -->
  <!-- B1 RE2: $0.0099, 0.911 -->
  <circle class="dot dot-b1" cx="126" cy="96" r="6"/>
  <text class="anno" x="136" y="92">RE2 B1</text>

  <!-- MA RE2: $0.034, 0.911 -->
  <circle class="dot dot-ma" cx="239" cy="96" r="6"/>
  <text class="anno" x="249" y="92">RE2 MA</text>

  <!-- Vote of 3 RE2: $0.0229, 0.956 -->
  <circle class="dot dot-vote" cx="187" cy="78" r="7"/>
  <text class="best" x="197" y="74">RE2 Vote×3</text>

  <!-- RE2 strong model -->
  <!-- B1 strong: $0.080, 0.889 -->
  <circle class="dot dot-b1" cx="453" cy="104" r="5" opacity="0.6"/>
  <text class="anno" x="463" y="100" opacity="0.6">B1 strong</text>

  <!-- MA strong: $0.113, 0.978 -->
  <circle class="dot dot-ma" cx="607" cy="69" r="5" opacity="0.6"/>
  <text class="anno" x="560" y="64" opacity="0.6">MA strong</text>

  <!-- SIM-AI -->
  <!-- B1 SIM: $0.010, 0.894 -->
  <circle class="dot dot-b1" cx="127" cy="102" r="5"/>
  <line class="connector" x1="127" y1="102" x2="127" y2="96"/>

  <!-- MA SIM: $0.0205, 0.833 -->
  <circle class="dot dot-ma" cx="176" cy="127" r="5"/>
  <text class="anno" x="186" y="123">SIM MA</text>

  <!-- CE SIM: $0.0081, 0.728 -->
  <circle class="dot dot-ce" cx="118" cy="169" r="6"/>
  <text class="anno" x="128" y="165">SIM CE</text>

  <!-- Pareto frontier hint -->
  <path d="M118 169 Q 120 130 127 102 Q 150 85 187 78" fill="none" stroke="#d6ef62" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
</svg>
