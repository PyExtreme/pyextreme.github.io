<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A guardrail path that names an instance, before and after</title>
<desc id="d">Before: the dotted path resolves to an instance, calling it raises TypeError, init_guardrails_v2 catches TypeError as skippable config, and the proxy boots healthy without the guardrail. After: the resolved value is checked first and CustomGuardrailPathError is raised, which the skip does not catch, so startup stops and the error shows the class path to use.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">An instance in the guardrail slot now stops startup</text>
<text class="ink2 mono" x="40" y="54" font-size="11.5">guardrail: custom_callbacks.proxy_handler_instance</text>
<text class="ink" x="40" y="114" font-size="14" font-weight="600">Before</text>
<rect class="box" x="140" y="88" width="130" height="62" rx="6"/>
<text class="ink" x="205" y="114" font-size="13" font-weight="600" text-anchor="middle">resolve path</text>
<text class="ink2 mono" x="205" y="133" font-size="11" text-anchor="middle">get_instance_fn</text>
<rect class="bad" x="290" y="88" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="355" y="114" font-size="13" font-weight="600" text-anchor="middle">call it</text>
<text class="badt mono" x="355" y="133" font-size="11" text-anchor="middle">TypeError</text>
<rect class="bad" x="440" y="88" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="505" y="114" font-size="13" font-weight="600" text-anchor="middle">skip wrapper</text>
<text class="badt mono" x="505" y="133" font-size="11" text-anchor="middle">except TypeError</text>
<rect class="bad" x="590" y="88" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="655" y="114" font-size="13" font-weight="600" text-anchor="middle">boots healthy</text>
<text class="badt mono" x="655" y="133" font-size="11" text-anchor="middle">no guardrail</text>
<line class="line" x1="270" x2="288" y1="119" y2="119" marker-end="url(#a)"/>
<line class="line" x1="420" x2="438" y1="119" y2="119" marker-end="url(#a)"/>
<line class="line" x1="570" x2="588" y1="119" y2="119" marker-end="url(#a)"/>
<line class="line" x1="40" x2="720" y1="186" y2="186" stroke-width="1"/>
<text class="ink" x="40" y="246" font-size="14" font-weight="600">After</text>
<rect class="box" x="140" y="220" width="130" height="62" rx="6"/>
<text class="ink" x="205" y="246" font-size="13" font-weight="600" text-anchor="middle">resolve path</text>
<text class="ink2 mono" x="205" y="265" font-size="11" text-anchor="middle">get_instance_fn</text>
<rect class="good" x="290" y="220" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="355" y="246" font-size="13" font-weight="600" text-anchor="middle">check value</text>
<text class="goodt mono" x="355" y="265" font-size="11" text-anchor="middle">not callable</text>
<rect class="good" x="440" y="220" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="505" y="246" font-size="13" font-weight="600" text-anchor="middle">PathError</text>
<text class="goodt mono" x="505" y="265" font-size="11" text-anchor="middle">skip lets it by</text>
<rect class="good" x="590" y="220" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="655" y="246" font-size="13" font-weight="600" text-anchor="middle">startup stops</text>
<text class="goodt mono" x="655" y="265" font-size="11" text-anchor="middle">with a hint</text>
<line class="line" x1="270" x2="288" y1="251" y2="251" marker-end="url(#a)"/>
<line class="line" x1="420" x2="438" y1="251" y2="251" marker-end="url(#a)"/>
<line class="line" x1="570" x2="588" y1="251" y2="251" marker-end="url(#a)"/>
<text class="ink2" x="140" y="310" font-size="12">Hint in the error:</text>
<text class="goodt mono" x="250" y="310" font-size="11.5">guardrail: custom_callbacks.MyCustomHandler</text>
</svg>
