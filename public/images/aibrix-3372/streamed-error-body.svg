<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A chunked upstream error through Envoy ext_proc, before and after</title>
<desc id="d">Before: the 400 headers are forwarded to the client, then the gateway answers a body chunk with an ImmediateResponse. Envoy can no longer replace the reply, so it resets the stream and the client sees a 400 with an empty body. After: the gateway removes Content-Length when it handles the headers, clears the non-final chunk, and writes the complete normalized error into the end-of-stream chunk with body_mutation, so the client receives the full JSON error.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">A split upstream error body now reaches the client whole</text>
<text class="ink2" x="40" y="54" font-size="12.5">Upstream 400, body arrives as two ResponseBody messages, response body mode STREAMED</text>

<text class="ink" x="40" y="114" font-size="14" font-weight="600">Before</text>
<text class="ink2" x="40" y="132" font-size="12">answer per chunk</text>
<rect class="box" x="160" y="88" width="130" height="62" rx="6"/>
<text class="ink" x="225" y="114" font-size="13" font-weight="600" text-anchor="middle">Headers</text>
<text class="ink2 mono" x="225" y="133" font-size="11" text-anchor="middle">400 sent on</text>
<line class="line" x1="290" x2="316" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="318" y="88" width="170" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="403" y="114" font-size="13" font-weight="600" text-anchor="middle">Body chunk</text>
<text class="badt mono" x="403" y="133" font-size="11" text-anchor="middle">ImmediateResponse</text>
<line class="line" x1="488" x2="514" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="516" y="88" width="204" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="618" y="114" font-size="13" font-weight="600" text-anchor="middle">Stream reset</text>
<text class="badt mono" x="618" y="133" font-size="11" text-anchor="middle">client: 400, empty body</text>

<line class="line" x1="40" x2="720" y1="186" y2="186" stroke-width="1"/>

<text class="ink" x="40" y="246" font-size="14" font-weight="600">After</text>
<text class="ink2" x="40" y="264" font-size="12">mutate the stream</text>
<rect class="good" x="160" y="220" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="225" y="246" font-size="13" font-weight="600" text-anchor="middle">Headers</text>
<text class="goodt mono" x="225" y="265" font-size="11" text-anchor="middle">drop length</text>
<line class="line" x1="290" x2="316" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="318" y="220" width="170" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="403" y="246" font-size="13" font-weight="600" text-anchor="middle">Chunk 1</text>
<text class="goodt mono" x="403" y="265" font-size="11" text-anchor="middle">body cleared</text>
<line class="line" x1="488" x2="514" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="516" y="220" width="204" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="618" y="246" font-size="13" font-weight="600" text-anchor="middle">End-of-stream chunk</text>
<text class="goodt mono" x="618" y="265" font-size="11" text-anchor="middle">full JSON error</text>
</svg>
