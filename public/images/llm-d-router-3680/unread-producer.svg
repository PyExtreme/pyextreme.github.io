<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A configured producer that nothing reads, next to the default that replaced it</title>
<desc id="d">The user configures an approx-prefix-cache-producer named prefix-producer. It writes PrefixCacheMatchInfoDataKey/prefix-producer, which no plugin reads. The prefix-cache-scorer, configured without prefixMatchInfoProducerName, requires PrefixCacheMatchInfoDataKey/approx-prefix-cache-producer, so the EPP auto-creates a default approx-prefix-cache-producer to serve it. Both producers run. The fix adds a startup warning naming the unread producer, its key, the default producer and the consumer.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="340" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">Two prefix producers run, and only one is read</text>
<text class="ink2" x="40" y="54" font-size="12.5">The issue's config: a custom-named producer and a scorer left at its default</text>

<text class="ink2" x="40" y="84" font-size="11.5" font-weight="600">PRODUCER</text>
<text class="ink2" x="290" y="84" font-size="11.5" font-weight="600">DATA KEY</text>
<text class="ink2" x="600" y="84" font-size="11.5" font-weight="600">READER</text>

<rect class="box" x="40" y="96" width="210" height="62" rx="6"/>
<text class="ink mono" x="145" y="122" font-size="12.5" font-weight="600" text-anchor="middle">prefix-producer</text>
<text class="ink2" x="145" y="141" font-size="11.5" text-anchor="middle">configured in YAML</text>
<line class="line" x1="250" x2="286" y1="127" y2="127" marker-end="url(#a)"/>
<rect class="bad" x="288" y="96" width="272" height="62" rx="6" stroke-width="1.5"/>
<text class="badt mono" x="424" y="122" font-size="11.5" text-anchor="middle">PrefixCacheMatchInfoDataKey/</text>
<text class="badt mono" x="424" y="140" font-size="11.5" font-weight="600" text-anchor="middle">prefix-producer</text>
<rect class="bad" x="600" y="96" width="130" height="62" rx="6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="badt" x="665" y="122" font-size="13" font-weight="600" text-anchor="middle">nobody</text>
<text class="badt" x="665" y="141" font-size="11.5" text-anchor="middle">still runs per request</text>

<rect class="good" x="40" y="182" width="210" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt mono" x="145" y="208" font-size="11.5" font-weight="600" text-anchor="middle">approx-prefix-cache-producer</text>
<text class="goodt" x="145" y="227" font-size="11.5" text-anchor="middle">auto-created default</text>
<line class="line" x1="250" x2="286" y1="213" y2="213" marker-end="url(#a)"/>
<rect class="good" x="288" y="182" width="272" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt mono" x="424" y="208" font-size="11.5" text-anchor="middle">PrefixCacheMatchInfoDataKey/</text>
<text class="goodt mono" x="424" y="226" font-size="11.5" font-weight="600" text-anchor="middle">approx-prefix-cache-producer</text>
<line class="line" x1="560" x2="596" y1="213" y2="213" marker-end="url(#a)"/>
<rect class="good" x="600" y="182" width="130" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt mono" x="665" y="208" font-size="12" font-weight="600" text-anchor="middle">prefix-scorer</text>
<text class="goodt" x="665" y="227" font-size="11.5" text-anchor="middle">reads the default</text>

<line class="line" x1="40" x2="720" y1="268" y2="268" stroke-width="1"/>
<text class="ink" x="40" y="294" font-size="13" font-weight="600">New at startup</text>
<text class="ink2 mono" x="40" y="314" font-size="11">Warning: configured producer's data key has no consumer ... producer=prefix-producer</text>
</svg>
