<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">An empty streamed reply, cached before and skipped after</title>
<desc id="d">Before: a provider returns an empty text block. The old check counts any opened content block as output, so the empty reply is stored and every repeat is replayed without calling the provider. After: the check reads the block payload, finds the text empty, does not store it, and the retry reaches the provider.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">An empty streamed reply is no longer cached</text>
<text class="ink2" x="40" y="54" font-size="12.5">Same request, sent twice through /v1/messages to a Gemini deployment</text>
<text class="ink" x="40" y="114" font-size="14" font-weight="600">Before</text>
<text class="ink2" x="40" y="132" font-size="12">block opened</text>
<rect class="box" x="160" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="ink" x="220" y="114" font-size="13" font-weight="600" text-anchor="middle">Provider</text>
<text class="ink mono" x="220" y="133" font-size="11.5" text-anchor="middle">empty reply</text>
<line class="line" x1="280" x2="306" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="308" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="368" y="114" font-size="13" font-weight="600" text-anchor="middle">Cache check</text>
<text class="badt mono" x="368" y="133" font-size="11.5" text-anchor="middle">start = output</text>
<line class="line" x1="428" x2="454" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="456" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="516" y="114" font-size="13" font-weight="600" text-anchor="middle">Stored</text>
<text class="badt mono" x="516" y="133" font-size="11.5" text-anchor="middle">empty entry</text>
<line class="line" x1="576" x2="602" y1="119" y2="119" marker-end="url(#a)"/>
<rect class="bad" x="604" y="88" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="badt" x="664" y="114" font-size="13" font-weight="600" text-anchor="middle">Every repeat</text>
<text class="badt mono" x="664" y="133" font-size="11.5" text-anchor="middle">no provider call</text>
<line class="line" x1="40" x2="720" y1="186" y2="186" stroke-width="1"/>
<text class="ink" x="40" y="246" font-size="14" font-weight="600">After</text>
<text class="ink2" x="40" y="264" font-size="12">payload read</text>
<rect class="box" x="160" y="220" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="ink" x="220" y="246" font-size="13" font-weight="600" text-anchor="middle">Provider</text>
<text class="ink mono" x="220" y="265" font-size="11.5" text-anchor="middle">empty reply</text>
<line class="line" x1="280" x2="306" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="308" y="220" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="368" y="246" font-size="13" font-weight="600" text-anchor="middle">Cache check</text>
<text class="goodt mono" x="368" y="265" font-size="11.5" text-anchor="middle">text is empty</text>
<line class="line" x1="428" x2="454" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="456" y="220" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="516" y="246" font-size="13" font-weight="600" text-anchor="middle">Skipped</text>
<text class="goodt mono" x="516" y="265" font-size="11.5" text-anchor="middle">not stored</text>
<line class="line" x1="576" x2="602" y1="251" y2="251" marker-end="url(#a)"/>
<rect class="good" x="604" y="220" width="120" height="62" rx="6" stroke-width="1.5"/>
<text class="goodt" x="664" y="246" font-size="13" font-weight="600" text-anchor="middle">Every repeat</text>
<text class="goodt mono" x="664" y="265" font-size="11.5" text-anchor="middle">provider called</text>
</svg>
