<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">The response guard on a two-choice Chat answer, before and after</title>
<desc id="d">Before: the upstream answer has a benign choice 0 and an unsafe choice 1. The guard reads only choice 0, passes the answer, and the client receives both choices with choice 1 unchecked. After: the guard reads choice 0, then choice 1, blocks on choice 1, and the client receives a 400 refusal instead of either choice.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:#f3f2ef;stroke:#d6d5d0}.bad{fill:#fbe9e5;stroke:#d0452b}.good{fill:#e6effa;stroke:#2a78d6}.badt{fill:#b3361f}.goodt{fill:#1f5fae}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.line{stroke:#9b9a95;fill:none}.arrow{fill:#9b9a95}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.box{fill:#24241f;stroke:#3d3d38}.bad{fill:#3a201b;stroke:#ef6a4f}.good{fill:#1b2a3d;stroke:#3987e5}.badt{fill:#ef8a73}.goodt{fill:#79acef}.line{stroke:#6f6e69}.arrow{fill:#6f6e69}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<text class="ink" x="40" y="34" font-size="17" font-weight="600">A benign first choice no longer clears the rest</text>
<text class="ink2" x="40" y="54" font-size="12.5">Blocking jailbreak guard, upstream Chat answer with n=2</text>

<text class="ink" x="40" y="126" font-size="14" font-weight="600">Before</text>
<rect class="box" x="130" y="84" width="140" height="72" rx="6"/>
<text class="ink" x="200" y="106" font-size="13" font-weight="600" text-anchor="middle">Chat answer</text>
<text class="ink2 mono" x="200" y="125" font-size="11" text-anchor="middle">0: benign</text>
<text class="badt mono" x="200" y="142" font-size="11" text-anchor="middle">1: unsafe</text>
<line class="line" x1="270" x2="296" y1="120" y2="120" marker-end="url(#a)"/>
<rect class="bad" x="298" y="84" width="190" height="72" rx="6" stroke-width="1.5"/>
<text class="badt" x="393" y="113" font-size="13" font-weight="600" text-anchor="middle">guard reads choice 0</text>
<text class="badt mono" x="393" y="133" font-size="11" text-anchor="middle">Output only, passed</text>
<line class="line" x1="488" x2="514" y1="120" y2="120" marker-end="url(#a)"/>
<rect class="bad" x="516" y="84" width="204" height="72" rx="6" stroke-width="1.5"/>
<text class="badt" x="618" y="113" font-size="13" font-weight="600" text-anchor="middle">client gets both</text>
<text class="badt mono" x="618" y="133" font-size="11" text-anchor="middle">choice 1 unchecked</text>

<line class="line" x1="40" x2="720" y1="185" y2="185" stroke-width="1"/>

<text class="ink" x="40" y="256" font-size="14" font-weight="600">After</text>
<rect class="box" x="130" y="214" width="140" height="72" rx="6"/>
<text class="ink" x="200" y="236" font-size="13" font-weight="600" text-anchor="middle">Chat answer</text>
<text class="ink2 mono" x="200" y="255" font-size="11" text-anchor="middle">0: benign</text>
<text class="badt mono" x="200" y="272" font-size="11" text-anchor="middle">1: unsafe</text>
<line class="line" x1="270" x2="296" y1="250" y2="250" marker-end="url(#a)"/>
<rect class="good" x="298" y="214" width="190" height="72" rx="6" stroke-width="1.5"/>
<text class="goodt" x="393" y="243" font-size="13" font-weight="600" text-anchor="middle">reads each choice</text>
<text class="goodt mono" x="393" y="263" font-size="11" text-anchor="middle">0 passed, 1 blocked</text>
<line class="line" x1="488" x2="514" y1="250" y2="250" marker-end="url(#a)"/>
<rect class="good" x="516" y="214" width="204" height="72" rx="6" stroke-width="1.5"/>
<text class="goodt" x="618" y="243" font-size="13" font-weight="600" text-anchor="middle">answer refused</text>
<text class="goodt mono" x="618" y="263" font-size="11" text-anchor="middle">400, no choice sent</text>
<text class="ink2" x="40" y="314" font-size="12">The same path covers ratings decisions, which return one Chat choice per model.</text>
</svg>
